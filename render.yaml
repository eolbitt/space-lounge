# Space Lounge — Render Blueprint (free tier)
# One web service: Next.js + same-origin presence WebSocket at /ws
#
# Dashboard: New → Blueprint → select the GitHub repo that contains this file
# Or: https://dashboard.render.com/select-repo?type=blueprint
#
# GitHub connect (one-time):
#   https://dashboard.render.com/u/settings#account-security
#   → Git Deployment Credentials → Add credential → GitHub
#   App install: https://github.com/apps/render/installations/new

services:
  - type: web
    name: space-lounge
    runtime: node
    plan: free
    region: oregon
    # Prefer main after GitHub mirror; keep feature branch as fallback via Dashboard
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
